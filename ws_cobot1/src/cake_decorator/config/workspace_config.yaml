# 원래의 노드별 ros__parameters 구조를 유지한다.
# ROS 케이크 위치·치수·접근 거리는 m, 방향은 rad, 선속도는 mm/s다.
# 케이크 중심은 BASE 기준 윗면 중심이며 실제 위치는 접촉 확인한 TCP로 정한다.
# 아직 측정하지 않은 픽업·거치대·출고 좌표는 임의의 0으로 채우지 않는다.
drawing_path_node:
  ros__parameters:
    # 경로 기준 원뿔대: 윗지름113.5mm, 밑지름118.5mm, 높이79mm.
    # 실제 경로 치수는 주문 요청이 전달하며 이 값은 문서용 기본 치수다.
    cake_radius: 0.05675
    cake_bottom_radius: 0.05925
    cake_height: 0.079
    cake_orientation: 0.0
    # 아래 접근·속도 설정은 PR #16의 실행 계약을 유지한다.
    # 윗면 그리기 기준 속도(mm/s). 주문 속도 비율은 이 값에 곱한다.
    drawing_speed: 40.0
    # 옆면 접촉 후의 원호·스플라인만 60mm/s로 높인다. 기울기는 아래 15도를 유지한다.
    side_drawing_speed: 60.0
    travel_speed: 180.0
    # 펜촉이 표면에서 빠지는 단계는 기존 속도로 유지한다.
    pen_up_speed: 120.0
    # DP 내부 접근 거리 단위는 mm다. RE의 m 파라미터와 구분한다.
    approach_height: 10.0
    simplify_tolerance_mm: 0.15
    duplicate_tolerance_mm: 0.01
    side_path_error_mm: 0.1
    side_diagonal_mode: spline
    side_pen_vertical_deg: 15.0
    # 지름 기준 유격을 8.0에서 1.5mm 줄임: 6.5mm, 반지름 보정 +3.25mm.
    side_diameter_allowance_mm: 6.5
    side_y_inset_mm: 1.0
    # 웹 띠 좌우 끝이 이어진 옆면 링은 이음매를 지나 3mm 더 겹쳐 그린다. 0이면 끈다.
    side_seam_overlap_mm: 3.0
    drawing_z_offset: 0.0
    # TOP은 YES 시점의 펜 자세를 우선 유지하고, 영점 자세가 없을 때만 수직을 쓴다.
    # SIDE의 수직 기준 15도 설정과 별개다.
    pen_tilt_deg: 0.0
    side_margin_ratio: 0.05
    # cake_center_x/y와 cake_top_z는 티칭 전이므로 기본 실행 좌표로 넣지 않는다.
    # TM이 기록한 윗면 중심을 GenerateTrajectory.cake_pose로 전달한다.

robot_executor_node:
  ros__parameters:
    service_timeout: 5.0
    # 펜 인출·케이크 공중 이동·거치대 반납 전용(mm/s, mm/s²).
    pen_travel_speed_mm_s: 180.0
    pen_lift_speed_mm_s: 150.0
    pen_rack_speed_mm_s: 120.0
    pen_motion_acc_mm_s2: 400.0
    # 도구 자세의 회전 제한도 함께 올려 선속도만 높여도 느린 현상을 줄인다.
    pen_rotation_speed_deg_s: 90.0
    pen_rotation_acc_deg_s2: 180.0
    # 옆면 펜의 45도 기울임·수직 복귀: 기존 45도/s의 70%인 31.5도/s.
    pen_tilt_speed_deg_s: 31.5
    pen_tilt_acc_deg_s2: 90.0
    # 케이크 운반·그리기 구간은 기존 속도 유지. 빈손·도구 이동만 가속한다.
    free_joint_speed_deg_s: 60.0
    free_joint_acc_deg_s2: 120.0
    free_line_speed_mm_s: 150.0
    free_line_acc_mm_s2: 300.0
    # 케이크를 실제 들어올리거나 안착시키는 개별 동작은 감속한다.
    cake_lift_speed_mm_s: 25.0
    cake_lift_acc_mm_s2: 50.0
    cake_seat_joint_speed_deg_s: 15.0
    cake_seat_joint_acc_deg_s2: 15.0
    # 아래 값은 기존 접근·도구 설정이다. 실제 파지·운반은 별도 검증한다.
    approach_height: 0.05
    pen_grip_width: 10.0
    pen_grip_force: 20.0
    gripper_open_width: 100.0
    # 펜 거치대 좌표
    pen_stand_pose: [248.86, 244.77, 312.99, 123.66, 180.00, 123.43] # 펜을 잡을 위치
    pen_stand_approach_pose: [43.61, -1.88, 99.63, 0.09, 82.26, 43.29] # 펜이 있는 위치의 상공
    pen_gripper_pose: [248.91, 244.76, 548.06, 37.07, -179.99, 36.84] # 펜을 잡고 수직 상공
    pen_drop_approach_pose: [43.58, 0.53, 69.85, 0.09, 109.63, 43.31] # 펜을 놓을 위치 상공
    pen_drop_pose: [248.86, 244.77, 314.84, 40.25, 180.00, 40.02] # 펜을 놓을 위치
    pen_drop_after_pose: [248.91, 244.76, 548.06, 37.07, -179.99, 36.84] # 펜을 놓은 후 상공
    cake_center_approach_pose: [-8.65, 8.16, 63.77, 0.00, 108.71, -9.48] # 케이크 중심 상공 위치
    # 윗면 누름을 줄이기 위해 기존 티칭 Z=510.39mm에서 총 3.09mm 올린다.
    cake_center_pose: [401.80, -55.57, 511.68, 179.76, 179.35, 179.02] # 기본 TCP 기준 윗면 그리기 자세: 직전 Z에서 -1.5mm
    # [변경 2026-11-18] move cakeplate_update.txt 기준 좌표/주석 정정(기존 잘못된 매핑 수정).
    # 기존 드로잉 파라미터는 유지. 신규 시퀀스는 명시적 활성화 전 실행 금지.
    # 실물 테스트 메모: TCP/툴, 동작 경로, 충돌 가능성은 장비에서 확인.
    # plate_sequence_enabled=false: 기존 드로잉만 실행; true: 준비/드로잉/후처리 연결.
    # 원본 set_singular_handling(DR_AVOID)는 특이점 회피 설정이며 현재 Git 기본 제어 방식을 유지(미적용).
    # 원본 속도: velj=60, accj=100, velx=[250,80.625], accx=[1000,322.5].
    # [요청] 위 원본 속도는 적용하지 않음. Git 함수의 기본값을 사용.
    # 작업 취소/비상정지 메모: ROS2 작업 취소 처리와 장비 물리적 비상정지는 별개.
    plate_sequence_enabled: false
    # [변경 2026-11-19] 그리퍼 최신 PM 방식: 제어박스 디지털 출력(DO) 펄스.
    # 기본 DO2=Open, DO1=Close, 0.5초 유지. 실제 배선이 반대이면 아래 두
    # 포트 값만 교환한다(예: open=1, close=2). 코드는 수정하지 않는다.
    # 포트는 1~16 범위여야 하고 서로 달라야 하며, 펄스는 0보다 커야 한다.
    # 잘못된 값이면 robot_executor_node가 시작 단계에서 오류로 중단한다.
    # 설정 변경은 로봇이 정지한 상태(노드 시작 전)에서만 적용한다.
    gripper_open_do: 2
    gripper_close_do: 1
    gripper_pulse_sec: 0.5
    # 가상환경에 set_ctrl_box_digital_output 서비스가 없을 때만 기존
    # /onrobot/sendCommand를 대체 경로로 사용한다. DO 호출이 실패해도
    # 다른 포트나 백엔드로 자동 전환하지 않는다.
    gripper_virtual_fallback: true
    # 아래 width/force 값은 DO 방식에서 호환용으로만 남긴다.
    # 가상 RG2 대체 경로에서는 open/close 명령 인수로 사용된다.
    # close: 0.5초 + 0.5초 대기, open: 1.0초 대기.
    opener_grip_width_mm: 10.0  # 기존 gripper_close 기본값. 실제 오프너 폭 확인 필요
    opener_grip_force_n: 20.0   # 기존 gripper_close 기본값. 실제 파지력 확인 필요
    opener_open_width_mm: 100.0 # 기존 gripper_open 기본값. 실제 해제 폭 확인 필요
    opener_close_wait_sec: 0.5  # 원본 DO1 ON 후 대기시간
    opener_close_settle_sec: 0.5  # 원본 DO1 OFF 후 대기시간
    opener_open_wait_sec: 1.0   # 원본 DO2 ON 후 대기시간
    opener_pre_open_wait_sec: 1.0  # 신규: pick()의 사전 open 완료 대기
    # 원본 이동속도는 기본값으로 강제하지 않음: 기존 Git 제어 함수 기본값 사용.
    # 기준 무게 측정은 향후 구현 예정이며 현재 주석만 유지.
    # [추가] opener 반납 후 safe position 5로 최종 이동(기존 시퀀스 대비 추가).
    # 아래 6원소: 관절 joint=deg, 직선 line=[mm,mm,mm,ZYZ deg,deg,deg].
    # mode=relative는 현재 자세 기준 증분, absolute는 BASE 기준 목표값.

    # safe position 1 | joint, absolute | [2026-11-18 갱신: move cakeplate_update.txt]
    # 작업 시작 전 오프너 파지 구역으로 이동하기 위한 초기 안전 자세
    plate_safe_position_1: [35.00, 40.00, 35.00, -20.00, 120.00, 120.00]

    # pick_opener1 | line, absolute | [2026-11-19 갱신: m0609_test_so1v2]
    # 오프너가 놓인 위치의 상단으로 TCP를 직선 이동
    plate_pick_opener1: [426.73, 252.72, 379.41, 97.11, -180.00, 97.02]

    # pick_opener2 | line, relative | [2026-11-19 갱신: m0609_test_so1v2]
    # 오프너 상단에서 베이스 Z축 방향으로 93mm 하강
    # 그리퍼가 오프너의 손잡이를 파지할 수 있는 위치로 접근
    plate_pick_opener2: [0.00, 0.00, -93.00, 0.00, 0.00, 0.00]

    # move_cake_ps_L | line, absolute | [2026-11-18 갱신: move cakeplate_update.txt]
    # 오프너를 파지한 상태에서 기존 접근 위치로 93mm 상승
    # 오프너를 보관 위치에서 들어 올려 주변 구조물과 분리
    plate_move_cake_ps_l: [426.73, 252.72, 379.41, 30.09, 179.36, 28.13]

    # move_cake_ps_L2 | line, absolute | [2026-11-18 갱신: move cakeplate_update.txt]
    # 오프너를 파지한 채 베이스 X축 +180mm 방향으로 수평 이동
    # 케이크 받침판을 들어 올리기 위한 작업 구역으로 접근
    plate_move_cake_ps_l2: [606.73, 252.72, 379.41, 30.09, 179.36, 28.13]

    # move_cake_plate_ps1 | joint, absolute | [2026-11-19 갱신: m0609_test_so1v2]
    # 케이크 받침판을 들어 올리기 위한 초기 관절 자세로 변경
    # 오프너 끝단을 케이크 받침판의 걸림 위치에 맞추는 단계
    plate_move_cake_plate_ps1: [-0.09, 37.66, 45.13, 0.15, 96.70, -0.02]

    # move_cake_plate_ps2 | joint, relative | [2026-11-18 갱신: move cakeplate_update.txt]
    # 5번 관절을 현재 각도에서 -7도 회전
    # 오프너의 기울기를 변경하여 케이크 틀 끝단을 오프너 홀에 걸어줌
    plate_move_cake_plate_ps2: [0.00, 0.00, 0.00, 0.00, -7.00, 0.00]

    # move_cake_plate_ps3 | joint, absolute | [2026-11-18 갱신: move cakeplate_update.txt]
    # 케이크 틀의 끝단을 오프너에 걸친 상태에서 뒤쪽으로 기울여 고정
    # 받침판을 들어 올리기 전 걸림 상태를 만드는 동작
    plate_move_cake_plate_ps3: [-0.15, 34.97, 45.68, 0.15, 88.96, -0.02]

    # move_cake_plate_ps4 | line, relative | [2026-11-18 갱신: move cakeplate_update.txt]
    # 케이크 틀이 오프너에 걸린 상태로 베이스 Z축 +80mm 상승
    # 받침판을 원래 위치에서 들어 올려 안전하게 이동할 수 있는 높이를 확보
    plate_move_cake_plate_ps4: [0.00, 0.00, 80.00, 0.00, 0.00, 0.00]

    # safe position 2 | joint, absolute | [2026-11-18 갱신: move cakeplate_update.txt]
    # 받침판을 들어 올린 후 드로잉 스테이션으로 이동하기 위한 안전 자세
    plate_safe_position_2: [35.00, 40.00, 35.00, -20.00, 120.00, 120.00]

    # cake_station_ps1 | joint, absolute | [2026-11-19 갱신: m0609_test_so1v2]
    # 오프너의 위치와 기울기를 조정하여 받침판 안착 지점인 스테이션 상단으로 접근
    plate_cake_station_ps1: [13.48, 28.62, 57.58, -15.84, 110.95, 143.08]

    # cake_station_ps2 | joint, absolute | [2026-11-19 갱신: m0609_test_so1v2]
    # 케이크 받침판을 스테이션에 넣기 위한 위치와 기울기, 높이 조정하여 지정 위치에 안착시키는 단계
    plate_cake_station_ps2: [10.49, 26.40, 61.25, -11.77, 106.52, 143.74]

    # cake_station_ps3 | joint, absolute | [2026-11-19 갱신: m0609_test_so1v2]
    # 케이크 받침판을 스테이션에 넣은 후 각도 조정으로 오프너에서 케이크 받침판을 분리하는 단계
    plate_cake_station_ps3: [4.00, 17.03, 73.00, -3.48, 94.57, 135.50]

    # cake_station_ps4 | joint, absolute | [2026-11-18 갱신: move cakeplate_update.txt]
    # 케이크 드로잉 작업 구역에서 로봇을 이탈시키는 동작
    plate_cake_station_ps4: [13.26, 24.26, 62.83, -3.12, 93.19, 138.85]

    # safe position 3 | joint, absolute | [2026-11-18 갱신: move cakeplate_update.txt]
    # 스테이션 배치 경로 수행 후 지정된 안전 대기 자세로 이동
    plate_safe_position_3: [35.00, 40.00, 35.00, -20.00, 120.00, 120.00]

    # pickup_cake_station_ps1 | joint, absolute | [2026-11-18 갱신: move cakeplate_update.txt]
    # 케이크 회수를 위해 스테이션의 기존 최종 배치 자세로 재진입
    # 오프너를 받침판 회수 작업 위치에 맞추는 동작
    plate_pickup_cake_station_ps1: [13.26, 24.26, 62.83, -3.12, 93.19, 138.85]

    # pickup_cake_station_ps2 | joint, absolute | [2026-11-19 갱신: m0609_test_so1v2]
    # 기존 배치 경로의 cake_station_ps3 자세로 되돌아감
    # 받침판을 스테이션에서 분리하기 위한 회수 방향으로 각도와 자세 변경
    plate_pickup_cake_station_ps2: [8.14, 23.81, 64.47, -5.02, 98.85, 145.37]

    # pickup_cake_station_ps3 | joint, absolute | [2026-11-19 갱신: m0609_test_so1v2]
    # 오프너에 걸린 받침판을 스테이션의 고정 위치에서 빼내는 과정
    plate_pickup_cake_station_ps3: [6.94, 26.03, 61.94, -7.47, 105.39, 139.67]

    # pickup_cake_station_ps4 | joint, absolute | [2026-11-19 갱신: m0609_test_so1v2]
    # 받침판을 출고 지점으로 이송하기 위해 스테이션 상단으로 이동
    plate_pickup_cake_station_ps4: [6.94, 26.30, 57.63, -7.22, 109.37, 138.20]

    # safe position 4 | joint, absolute | [2026-11-18 갱신: move cakeplate_update.txt]
    # 케이크 회수 경로 수행 후 지정된 안전 대기 자세로 이동
    plate_safe_position_4: [35.00, 40.00, 35.00, -20.00, 120.00, 120.00]

    # deliver_cake_station_ps1 | joint, absolute | [2026-11-18 갱신: move cakeplate_update.txt]
    # 회수한 케이크를 출고 지점으로 진입하기 위해 로봇 팔의 방향과 높이 변경
    plate_deliver_cake_station_ps1: [-0.17, 41.12, 21.84, 0.16, 106.65, 0.01]

    # deliver_cake_station_ps2 | joint, absolute | [2026-11-18 갱신: move cakeplate_update.txt]
    # 케이크 받침판을 출고 위치에 놓기 위해 각도와 자세 조정 단계
    plate_deliver_cake_station_ps2: [0.50, 33.55, 47.47, -1.71, 87.35, 1.79]

    # deliver_cake_station_ps3 | joint, absolute | [2026-11-19 갱신: m0609_test_so1v2]
    # 오프너에 걸린 케이크 받침판의 위치와 기울기 미세 조정으로 오프너와 케이크 받침판 결속 해제
    plate_deliver_cake_station_ps3: [1.05, 36.52, 47.50, -2.00, 88.40, -0.08]

    # deliver_cake_station_ps4 | joint, absolute | [2026-11-18 갱신: move cakeplate_update.txt]
    # 관절 자세를 변경하여 케이크 받침판의 최종 출고 동작 수행
    # 받침판을 내려놓은 상태에서 오프너와 분리
    plate_deliver_cake_station_ps4: [-0.09, 32.95, 54.30, 0.15, 93.31, -0.02]

    # deliver_cake_station_ps5 | line, relative | [2026-11-18 갱신: move cakeplate_update.txt]
